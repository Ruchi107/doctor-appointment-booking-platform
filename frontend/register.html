<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Register — Doctor Appointment Platform</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<nav id="nav"></nav>
<main>
  <h1>Create an Account</h1>
  <div id="alertBox"></div>

  <div class="card" style="max-width:440px;">
    <form id="registerForm">
      <label>Full Name</label>
      <input type="text" id="name" required />

      <label>Email</label>
      <input type="email" id="email" required />

      <label>Phone</label>
      <input type="text" id="phone" />

      <label>Password</label>
      <input type="password" id="password" required minlength="6" />

      <label>Account Type</label>
      <select id="role">
        <option value="patient">Patient</option>
        <option value="provider">Provider (Doctor)</option>
      </select>

      <div id="providerFields" style="display:none;">
        <label>Specialty</label>
        <input type="text" id="specialty" placeholder="e.g. Cardiology" />

        <label>Qualifications</label>
        <input type="text" id="qualifications" placeholder="e.g. MBBS, MD" />

        <label>Clinic Location</label>
        <input type="text" id="clinicLocation" placeholder="e.g. City Hospital, Andheri" />
      </div>

      <button type="submit">Register</button>
    </form>
  </div>
  <p class="muted">Already have an account? <a href="login.html">Log in</a></p>
</main>

<script src="js/api.js"></script>
<script>
renderNav();

const roleSelect = document.getElementById("role");
const providerFields = document.getElementById("providerFields");
roleSelect.addEventListener("change", () => {
  providerFields.style.display = roleSelect.value === "provider" ? "block" : "none";
});

document.getElementById("registerForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  try {
    await apiRequest("/auth/register", {
      method: "POST",
      body: {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value,
        password: document.getElementById("password").value,
        role: roleSelect.value,
        specialty: document.getElementById("specialty").value,
        qualifications: document.getElementById("qualifications").value,
        clinicLocation: document.getElementById("clinicLocation").value,
      },
    });
    showAlert("alertBox", "Registration successful! Redirecting to login...", "success");
    setTimeout(() => (window.location.href = "login.html"), 1200);
  } catch (err) {
    showAlert("alertBox", err.message, "error");
  }
});
</script>
</body>
</html>
